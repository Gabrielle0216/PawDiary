<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PawDiary 爪爪日记</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap">
<style>
:root{--bg:#FBF6EC;--card:#FFFDF8;--apricot:#F4E0C8;--sage:#A9C2A4;--sage-d:#4F6F52;--btn:#5E7F5F;--ink:#3A382F;--mute:#8A8574;--line:#EADFCB;--r:20px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#24221C;--card:#2E2B23;--apricot:#4A3E2C;--sage:#5F7D5C;--sage-d:#A8C7A4;--ink:#F1EBDD;--mute:#B2AB98;--line:#433E31}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 Nunito,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;padding-bottom:90px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:30}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 20px}
.logo{font-weight:800;font-size:20px;color:var(--sage-d);white-space:nowrap}.logo small{font-weight:500;color:var(--mute);font-size:13px;margin-left:6px}
nav{display:flex;gap:4px;margin-left:auto}
nav button{border:0;background:none;color:var(--ink);font:inherit;font-weight:700;padding:8px 14px;border-radius:99px;cursor:pointer;transition:.15s}
nav button i{font-style:normal;margin-right:6px}nav button.on{background:var(--apricot)}nav button:hover{background:var(--apricot)}
.sw{font-size:13px;color:var(--mute);display:flex;gap:6px;align-items:center;cursor:pointer;white-space:nowrap}.sw input{width:auto}
main{max-width:980px;margin:0 auto;padding:22px 18px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}h2{margin:0;font-size:24px}h3{margin:6px 0 2px;font-size:17px}
.btn{background:var(--btn);color:#fff;border:0;border-radius:99px;padding:9px 18px;font:inherit;font-weight:700;cursor:pointer;transition:.15s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.96)}.btn.g{background:var(--apricot);color:var(--ink)}.btn.s{padding:4px 12px;font-size:13px}.btn.x{background:none;color:var(--mute);padding:4px 8px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sage);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}.grid .card{margin:0}
.av{width:100%;aspect-ratio:4/3;border-radius:14px;object-fit:cover;background:linear-gradient(135deg,var(--apricot),var(--sage));display:grid;place-items:center;font-size:56px}
.mu{color:var(--mute);margin:0 0 8px;font-size:14px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{font-size:12px;padding:1px 9px;border-radius:99px;background:var(--apricot);font-weight:700;vertical-align:middle}.tag.demo{background:none;border:1px dashed var(--sage-d);color:var(--sage-d)}
.note{background:var(--apricot);border-radius:14px;padding:10px 14px;font-size:14px;margin-bottom:16px}
.empty{text-align:center;padding:30px}
.tl{border-left:3px solid var(--sage);margin-left:8px;padding-left:20px}.item{position:relative;margin-bottom:14px}.item::before{content:"";position:absolute;left:-29px;top:20px;width:11px;height:11px;border-radius:50%;background:var(--sage-d)}
.item img,.pvimg{max-width:100%;max-height:300px;border-radius:14px;margin-top:8px;display:block}
label{display:block;font-weight:700;font-size:13px;margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit}
.row select,.bar select{width:auto}textarea{resize:vertical;min-height:80px}
.err{color:#B5523B;font-size:13px;min-height:20px;margin:6px 0}
.ov{position:fixed;inset:0;background:#0007;z-index:50;display:grid;place-items:center;padding:16px}
.md{background:var(--card);border-radius:24px;padding:22px;width:min(480px,100%);max-height:90vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:60;font-weight:700;font-size:14px}
.stat{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}.stat span{background:var(--apricot);border-radius:12px;padding:4px 12px;font-weight:700}
.cm{background:var(--bg);border-radius:12px;padding:6px 12px;margin-top:6px;font-size:14px}
footer{text-align:center;color:var(--mute);font-size:13px;padding:10px}
@media (max-width:720px){
header{padding:10px 14px}.logo small,.sw span{display:none}
nav{position:fixed;left:0;right:0;bottom:0;margin:0;background:var(--card);border-top:1px solid var(--line);justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:25}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;padding:4px;font-size:12px;border-radius:12px}nav button i{margin:0;font-size:20px}
.toast{bottom:110px}}

/* v2 · dashboard, community and journal */
body{background:#f7f8f3}main{max-width:1220px;padding:30px 24px}header{padding:15px 32px;box-shadow:0 2px 18px #314c3510}.logo{font-size:23px}.card{box-shadow:0 5px 26px #4057430b;border:1px solid #e9eee4;background:#fff;border-radius:22px;padding:22px}.hero{background:linear-gradient(115deg,#eef5e8,#fff9ef);border:1px solid #e4ebde;border-radius:26px;padding:27px 32px;display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}.hero h2{font-size:27px;margin:4px 0}.eyebrow{font-size:11px;font-weight:800;letter-spacing:2px;color:#819e7d;text-transform:uppercase}.pet-tabs{display:flex;gap:10px;overflow:auto;margin-bottom:18px}.pet-tabs button,.chip{border:1px solid #dce7d8;border-radius:40px;padding:10px 18px;background:#fff;cursor:pointer;color:#4d6750;font:inherit;font-weight:700}.pet-tabs .active,.chip.selected{background:#e2eedf;border-color:#a9c2a4}.dash{display:grid;grid-template-columns:1.05fr 1.3fr 1fr;gap:18px}.dash>.card{margin:0;min-width:0}.profile-card{grid-row:span 2}.profile-card .av{height:230px;aspect-ratio:auto;object-fit:cover;margin-bottom:18px}.profile-card h2{margin:6px 0}.profile-meta{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.profile-meta span{background:#f4f7ef;padding:6px 10px;border-radius:9px;font-size:12px}.chart-card{grid-column:span 2}.section-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.section-top h3{margin:0}.circle-add{width:34px;height:34px;border:1px solid #b4cbb0;border-radius:50%;color:#537b55;background:#fff;font-size:23px;cursor:pointer}.record{padding:13px 0;border-bottom:1px solid #edf1ea;display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px}.record small,.mini-record small{color:#97a194}.dash-wide{grid-column:1/-1}.records-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.mini-record{background:#f6f9f4;border-radius:13px;padding:14px;display:flex;flex-direction:column;gap:5px}.community-layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,.85fr);gap:20px}.community-layout aside .card{margin-bottom:18px}.friend-row{display:flex;gap:10px;align-items:center;border-bottom:1px solid #eff1eb;padding:12px 0}.friend-avatar{width:46px;height:46px;flex-shrink:0;border-radius:50%;background:#eef4e9;display:grid;place-items:center;font-size:24px}.friend-info{flex:1;min-width:0;display:flex;flex-direction:column}.friend-info small{color:#8a9387}.post-head{display:flex;gap:12px;align-items:center;margin-bottom:15px}.post-head .mu{margin:0}.post-photo{width:100%;max-height:390px;object-fit:cover;border-radius:16px;margin-bottom:14px}.post-card h3{margin:12px 0}.post-actions{display:flex;gap:10px;border-top:1px solid #f0f1ed;padding-top:14px;margin-top:14px}.diary-layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(280px,.8fr);gap:22px}.diary-editor label{font-size:14px;margin-top:18px}.diary-editor .av{max-height:200px}.mood-section{padding:16px 0}.emoji-options{display:flex;gap:10px;margin:10px 0 20px;flex-wrap:wrap}.emoji-btn{font-size:25px;background:#f6f8f3;border:2px solid transparent;border-radius:15px;padding:8px 13px;cursor:pointer}.emoji-btn.chosen{background:#e6f2e2;border-color:#a2bda0}.privacy-box{display:flex;justify-content:space-between;gap:15px;align-items:center;background:#f5f9f3;border-radius:16px;padding:15px;margin:20px 0}.privacy-box select{width:auto;min-width:150px}.privacy-box p{margin:2px 0}.diary-editor>.btn{width:100%;padding:13px}.post-card{overflow:hidden}
@media(max-width:900px){.dash{grid-template-columns:1fr 1fr}.profile-card{grid-row:auto}.chart-card{grid-column:auto}.dash-wide{grid-column:1/-1}.community-layout,.diary-layout{grid-template-columns:1fr}}
@media(max-width:620px){main{padding:16px 12px}.hero{padding:20px;align-items:flex-start;flex-direction:column}.hero h2{font-size:22px}.dash{grid-template-columns:1fr}.chart-card,.dash-wide{grid-column:auto}.card{padding:17px}.privacy-box{flex-direction:column;align-items:stretch}.privacy-box select{width:100%}header{padding:10px 14px}}
</style>
<style>
.avatar-studio{background:var(--bg);border:1px solid var(--line);padding:13px;border-radius:16px;margin:14px 0}.avatar-studio .row{margin:8px 0}.avatar-preview{width:130px;height:130px;border-radius:18px;object-fit:cover;background:var(--apricot);display:block}.avatar-studio small{color:var(--mute)}.avatar-studio select{width:auto;max-width:100%}.avatar-choice{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.avatar-choice label{margin:0;font-weight:500}
</style></head>
<body>
<header><div class="logo">🐾 PawDiary<small>爪爪日记</small></div><label class="sw" style="margin:0 0 0 auto"><input type="checkbox" id="dm" onchange="S.demo=this.checked;save();render()"><span>显示演示数据</span></label><nav id="nav"></nav></header>
<main id="app"></main>
<footer>你创建的内容只保存在本设备的浏览器中。<button class="btn x" onclick="resetAll()">清空我的数据</button></footer>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const K='pawdiary_v1',today=()=>new Date().toISOString().slice(0,10),ago=n=>{const d=new Date();d.setDate(d.getDate()-n);return d.toISOString().slice(0,10)};
const uid=()=>'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const DEF=()=>({pets:[],health:[],tl:[],posts:[],likes:{},cmts:{},fol:{},city:'上海',area:'',demo:true,tab:'pets',hs:'',ts:'',hf:'all',mood:'😊',energy:'⚡',visibility:'public',communityFilter:'全部'});
let S=DEF();try{Object.assign(S,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('存储空间已满，请删除部分照片后重试')}};
let P={m:'',f:''},OPEN={};
const SP={dog:'🐶',cat:'🐱',other:'🐰'},TY={weight:'⚖️ 体重',vaccine:'💉 疫苗',deworm:'🪱 驱虫'};
/* 演示数据（带“演示”标记，可在右上角关闭） */
const DP=[{id:'d1',name:'麻薯',sp:'dog',breed:'柯基',bd:ago(700),g:'男孩',demo:1}];
const DH=[[200,6.2],[150,7.6],[100,9.1],[50,10.4],[7,11.3]].map((x,i)=>({id:'dh'+i,pid:'d1',type:'weight',date:ago(x[0]),val:x[1],demo:1})).concat([{id:'dv',pid:'d1',type:'vaccine',date:ago(120),name:'犬五联疫苗',demo:1},{id:'dd',pid:'d1',type:'deworm',date:ago(30),name:'体外驱虫',demo:1}]);
const DT=[{id:'dt1',pid:'d1',date:ago(60),text:'第一次去海边，麻薯被浪花吓得原地转圈。',demo:1},{id:'dt2',pid:'d1',date:ago(14),text:'学会了“握手”，奖励了两块鸡肉干。',demo:1}];
const DPOSTS=[{id:'dp1',pn:'年糕',owner:'小葵',text:'周末公园野餐，年糕全程只盯着我的三明治。',t:Date.now()-5*36e5,l:12,c:[{t:'太可爱了！',o:'阿柴'}],demo:1},{id:'dp2',pn:'汤圆',owner:'小满',text:'新买的猫爬架，三分钟后它选择睡在纸箱里。',t:Date.now()-30*36e5,l:25,c:[],demo:1},{id:'dp3',pn:'奶盖',owner:'Momo',text:'今天体重 4.2kg，医生说很标准，继续保持。',t:Date.now()-80*36e5,l:7,c:[{t:'加油！',o:'小满'}],demo:1}];
const PALS=[['汤圆','cat','布偶猫','女孩',14,'小满','上海','徐汇区','爱晒太阳，欢迎交换养猫心得。'],['年糕','dog','金毛','男孩',26,'小葵','上海','浦东新区','每周末在世纪公园散步。'],['奶盖','cat','英短','女孩',9,'Momo','上海','静安区','胆小但很黏人。'],['布丁','dog','比熊','男孩',18,'阿远','北京','朝阳区','寻找周末遛狗搭子。'],['芝麻','cat','三花','女孩',30,'小鹿','北京','海淀区','救助来的小猫，已绝育。'],['可乐','dog','柴犬','男孩',22,'阿柴','广州','天河区','表情管理大师。'],['雪球','other','垂耳兔','女孩',8,'Luna','深圳','南山区','爱吃苜蓿草。'],['拿铁','dog','柯基','男孩',15,'小周','杭州','西湖区','西湖边常出没。'],['团子','cat','美短','男孩',20,'阿宁','杭州','滨江区','夜间跑酷选手。'],['火锅','dog','边牧','女孩',36,'小川','成都','武侯区','精力旺盛，需要飞盘。']].map((a,i)=>({id:'p'+i,name:a[0],sp:a[1],breed:a[2],g:a[3],m:a[4],owner:a[5],city:a[6],area:a[7],bio:a[8],demo:1}));
/* 工具 */
const ageM=m=>m<12?m+' 个月':Math.floor(m/12)+' 岁'+(m%12?' '+m%12+' 个月':'');
const age=b=>ageM(Math.max(0,Math.floor((Date.now()-new Date(b))/2629800000)));
const allPets=()=>[...S.pets,...(S.demo?DP:[])],pet=id=>[...S.pets,...DP].find(p=>p.id==id);
const hAll=()=>[...S.health,...(S.demo?DH:[])];
const ph=p=>(p.avatarMode==='cartoon'&&p.cartoon?p.cartoon:p.photo)?`<img class="av" src="${p.avatarMode==='cartoon'&&p.cartoon?p.cartoon:p.photo}" alt="${esc(p.name)}">`:`<div class="av">${SP[p.sp]||'🐾'}</div>`;
const dt=x=>x.demo?'<span class="tag demo">演示</span>':'';
const rel=t=>{const s=(Date.now()-t)/1e3;return s<60?'刚刚':s<3600?~~(s/60)+' 分钟前':s<86400?~~(s/3600)+' 小时前':new Date(t).toLocaleDateString('zh-CN')};
const opts=(l,c)=>l.map(p=>`<option value="${p.id}" ${p.id==c?'selected':''}>${esc(p.name)}</option>`).join('');
function toast(m){$('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2200)}
const close=()=>{$('#ov')?.remove()};addEventListener('keydown',e=>e.key=='Escape'&&close());
function modal(t,b){close();const o=document.createElement('div');o.className='ov';o.id='ov';o.onclick=e=>{if(e.target==o)close()};o.innerHTML=`<div class="md" role="dialog" aria-label="${t}"><h3>${t}</h3>${b}</div>`;document.body.append(o)}
const err=m=>{$('#err').textContent=m;return false};
const btns=`<div class="row"><button class="btn">保存</button><button type="button" class="btn g" onclick="close()">取消</button></div>`;
function photoField(k){return `<label>照片（可选）</label><input type="file" accept="image/*" onchange="pickPhoto(this,'${k}')"><div id="pv${k}">${P[k]?`<img class="pvimg" src="${P[k]}" alt="预览">`:''}</div>`}
function pickPhoto(i,k){const f=i.files[0];if(!f)return;if(!f.type.startsWith('image/'))return toast('请选择图片文件');const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,560/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);P[k]=c.toDataURL('image/jpeg',.72);$('#pv'+k).innerHTML=`<img class="pvimg" src="${P[k]}" alt="预览">`};im.src=r.result};r.readAsDataURL(f)}
const noPet=()=>`<div class="card empty"><h3>还没有宠物档案</h3><p class="mu">先添加你的第一只宠物，再开始记录。</p><button class="btn" onclick="petForm()">添加宠物</button></div>`;
/* 视图 */
const T={pets:['🐾','宠物健康'],tl:['📖','成长时间线'],pals:['📍','同城社区'],feed:['✏️','日常分享']};
function go(t){S.tab=t;save();render();scrollTo(0,0)}
function jump(t,id){if(t=='health')S.hs=id;else S.ts=id;go(t)}
function render(){$('#nav').innerHTML=Object.entries(T).map(([k,v])=>`<button class="${S.tab==k?'on':''}" onclick="go('${k}')"><i>${v[0]}</i>${v[1]}</button>`).join('');$('#dm').checked=S.demo;$('#app').innerHTML=V[S.tab]()}
const V={
 pets(){const l=allPets(),p=l.find(x=>x.id==S.hs)||l[0];if(!l.length)return `<div class="bar"><h2>🐾 宠物健康档案</h2><button class="btn" onclick="petForm()">＋ 添加宠物</button></div>${noPet()}`;S.hs=p.id;const hs=hAll().filter(h=>h.pid==p.id).sort((a,b)=>b.date.localeCompare(a.date)),ws=hs.filter(h=>h.type=='weight'),vx=hs.filter(h=>h.type=='vaccine'),dw=hs.filter(h=>h.type=='deworm');return `<div class="hero"><div><div class="eyebrow">YOUR PET'S LITTLE WORLD</div><h2>每一天，都值得好好记录 🐾</h2><p class="mu">从健康档案到成长回忆，陪伴毛孩子的每一步。</p></div><button class="btn" onclick="petForm()">＋ 添加宠物</button></div><div class="pet-tabs">${l.map(x=>`<button class="${x.id==p.id?'active':''}" onclick="S.hs='${x.id}';save();render()">${SP[x.sp]||'🐾'} ${esc(x.name)}</button>`).join('')}</div><div class="dash"><div class="card profile-card">${ph(p)}<div class="eyebrow">MY LITTLE COMPANION</div><h2>${esc(p.name)} ${dt(p)}</h2><p class="mu">${esc(p.breed)} · ${esc(p.g)} · ${age(p.bd)}</p><div class="profile-meta"><span>🎂 ${esc(p.bd)}</span><span>🐾 ${p.sp=='dog'?'狗狗':p.sp=='cat'?'猫咪':'小宠'}</span></div><div class="row"><button class="btn g s" onclick="jump('tl','${p.id}')">成长故事</button>${p.demo?'':`<button class="btn g s" onclick="petForm('${p.id}')">编辑资料</button><button class="btn x s" onclick="delPet('${p.id}')">删除</button>`}</div></div><div class="card chart-card"><div class="section-top"><div><div class="eyebrow">HEALTH INSIGHTS</div><h3>⚖️ 体重成长曲线</h3></div><button class="circle-add" onclick="hForm('weight')">＋</button></div><div class="stat">${ws.length?`<span>最近体重 ${ws[0].val} kg</span>`:''}${ws.length>1?`<span>累计变化 ${(ws[0].val-ws.at(-1).val).toFixed(2)} kg</span>`:''}</div>${chart(ws)}</div><div class="card"><div class="section-top"><div><div class="eyebrow">HEALTH RECORDS</div><h3>💉 疫苗记录</h3></div><button class="circle-add" onclick="hForm('vaccine')">＋</button></div>${vx.length?vx.slice(0,4).map(h=>`<div class="record"><span>💉 ${esc(h.name)} ${dt(h)}</span><small>${h.date}</small></div>`).join(''):'<p function chart(ws){ws=[...ws].sort((a,b)=>a.date.localeCompare(b.date));if(ws.length<2)return '<p class="mu">至少需要 2 条体重记录才能显示变化趋势。</p>';const W=600,H=220,M=36,v=ws.map(w=>w.val),mn=Math.min(...v),mx=Math.max(...v),r=mx-mn||1,t0=+new Date(ws[0].date),tr=(+new Date(ws.at(-1).date)-t0)||1,X=w=>M+(new Date(w.date)-t0)/tr*(W-2*M),Y=w=>H-M-(w.val-mn)/r*(H-2*M);
return `<svg viewBox="0 0 ${W} ${H}" style="width:100%" role="img" aria-label="体重趋势图"><polyline fill="none" stroke="var(--sage-d)" stroke-width="3" stroke-linejoin="round" points="${ws.map(w=>X(w)+','+Y(w)).join(' ')}"/>${ws.map(w=>`<circle cx="${X(w)}" cy="${Y(w)}" r="5" fill="var(--btn)"/><text x="${X(w)}" y="${Y(w)-10}" text-anchor="middle" font-size="12" fill="var(--ink)">${w.val}</text><text x="${X(w)}" y="${H-10}" text-anchor="middle" font-size="10" fill="var(--mute)">${w.date.slice(5)}</text>`).join('')}</svg>`}

function avatarSvg(sp,breed,color,mark,style){
 const palette={cream:'#EBC88F',brown:'#A66E48',black:'#41424B',white:'#F7F1E7',gray:'#9CA4AE',orange:'#D98B49'};

 const patch=mark==='spots'?'<ellipse cx="88" cy="126" rx="30" ry="35" fill="#fff" opacity=".75"/>':mark==='mask'?'<path d="M77 111 Q130 79 183 111 L173 156 Q130 183 87 156Z" fill="#fff" opacity=".65"/>':'';
 const bg=style==='watercolor'?'#E4EEE6':style==='comic'?'#D7E8FF':'#F8E6D5';
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260"><rect width="260" height="260" rx="30" fill="${bg}"/><circle cx="130" cy="131" r="110" fill="#fff" opacity=".22"/>${ear}<ellipse cx="130" cy="141" rx="91" ry="88" fill="${fur}" stroke="#55463f" stroke-width="4"/>${patch}<ellipse cx="97" cy="129" rx="8" ry="11" fill="#332b2c"/><ellipse cx="163" cy="129" rx="8" ry="11" fill="#332b2c"/><ellipse cx="130" cy="162" rx="17" ry="12" fill="#48383a"/><path d="M130 174 Q113 192 101 179 M130 174 Q147 192 159 179" fill="none" stroke="#48383a" stroke-width="4" stroke-linecap="round"/><ellipse cx="74" cy="162" rx="15" ry="8" fill="#F3A7A4" opacity=".5"/><ellipse cx="186" cy="162" rx="15" ry="8" fill="#F3A7A4" opacity=".5"/><path d="M42 228 Q130 208 218 228" stroke="#fff" stroke-width="6" fill="none" opacity=".7"/></svg>`;
 return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
function avatarPanel(p){avatarMode=p.avatarMode||'real';avatarCartoon=p.cartoon||'';avatarStyle=p.avatarStyle||'storybook';return `<div class="avatar-studio"><b>🎨 宠物双形象工作室</b><p class="mu">可上传真实照片，或通过特征创建漫画形象。原图与漫画分别保留。</p><div class="avatar-choice"><label><input type="radio" name="avmode" value="real" ${avatarMode==='real'?'checked':''} onchange="avatarMode='real';refreshAvatar()"> 真实照片</label><label><input type="radio" name="avmode" value="cartoon" ${avatarMode==='cartoon'?'checked':''} onchange="avatarMode='cartoon';refreshAvatar()"> 漫画形象</label></div><div class="row"><select id="avcolor" onchange="refreshAvatar()"><option value="cream">奶油色</option><option value="brown">棕色</option><option value="orange">橘色</option><option value="black">黑色</option><option value="white">白色</option><option value="gray">灰色</option></select><select id="avmark" onchange="refreshAvatar()"><option value="none">纯色</option><option value="spots">斑点</option><option value="mask">脸部花纹</option></select><select id="avstyle" onchange="avatarStyle=this.value;refreshAvatar()"><option value="storybook">绘本手绘</option><option value="comic">清新漫画</option><option value="watercolor">水彩风格</option></select></div><div class="row"><button type="button" class="btn g s" onclick="makeAvatar()">✨ 根据特征生成漫画形象</button><button type="button" class="btn g s" onclick="photoToCartoon()">🖼️ 将上传照片转为漫画效果</button></div><div class="row"><img id="avatarPreview" class="avatar-preview" alt="宠物形象预览"><small id="avatarHelp">本地演示：特征绘制或照片滤镜，不是真实AI模型生成。<br>如需AI保持照片特征进行风格转换，需要接入图像生成API。</small></div></div>`}

function photoToCartoon(){if(!P.m)return toast('请先上传真实宠物照片');const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),z=320;c.width=z;c.height=z;const ctx=c.getContext('2d');ctx.filter='saturate(1.65) contrast(1.4)';ctx.drawImage(img,0,0,z,z);const d=ctx.getImageData(0,0,z,z);for(let i=0;i<d.data.length;i+=4){for(let j=0;j<3;j++)d.data[i+j]=Math.min(255,Math.round(d.data[i+j]/48)*48)}ctx.putImageData(d,0,0);avatarCartoon=c.toDataURL('image/jpeg',.72);avatarMode='cartoon';document.querySelector('input[name="avmode"][value="cartoon"]').checked=true;refreshAvatar();toast('已生成照片漫画滤镜效果（非AI）')};img.src=P.m}

function delPet(id){if(!confirm('删除后，这只宠物的健康记录和日记也会一并删除。确定吗？'))return;S.pets=S.pets.filter(x=>x.id!=id);S.health=S.health.filter(x=>x.pid!=id);S.tl=S.tl.filter(x=>x.pid!=id);save();render();toast('已删除')}
/* 健康 */
function hForm(pref){if(!S.pets.length){toast('请先添加你的宠物');return petForm()}modal('添加健康记录',`<form onsubmit="return saveH(event)"><label>宠物</label><select id="hp">${opts(S.pets,S.hs)}</select><label>类型</label><select id="ht" onchange="$('#hv').hidden=this.value!='weight';$('#hn').hidden=this.value=='weight'"><option value="weight" ${pref=='weight'?'selected':''}>体重</option><option value="vaccine" ${pref=='vaccine'?'selected':''}>疫苗</option><option value="deworm" ${pref=='deworm'?'selected':''}>驱虫</option></select><label>日期</label><input id="hd" type="date" max="${today()}" value="${today()}"><div id="hv"><label>体重（kg）</label><input id="hw" type="number" step="0.01" min="0.1" max="150"></div><div id="hn" hidden><label>名称</label><input id="hm" maxlength="40" placeholder="如：猫三联、体内驱虫"></div><label>备注（可选）</label><input id="ho" maxlength="100"><p class="err" id="err"></p>${btns}</form>`)}
function saveH(e){e.preventDefault();const t=$('#ht').value,o={id:uid(),pid:$('#hp').value,type:t,date:$('#hd').value,note:$('#ho').value.trim()};if(!o.date)return err('请选择日期');if(o.date>today())return err('日期不能晚于今天');
if(t=='weight'){o.val=parseFloat($('#hw').value);if(!(o.val>=.1&&o.val<=150))return err('请输入 0.1 到 150 之间的体重')}else{o.name=$('#hm').value.trim();if(!o.name)return err('请填写名称')}
S.health.push(o);S.hs=o.pid;save();close();render();toast('已添加记录')}
function delH(id){if(!confirm('确定删除这条记录？'))return;S.health=S.health.filter(x=>x.id!=id);save();render()}
/* 时间线 */
function tForm(id){if(!S.pets.length){toast('请先添加你的宠物');return petForm()}const x=S.tl.find(y=>y.id==id)||{};P.t=x.photo||'';modal(id?'编辑日记':'写日记',`<form onsubmit="return saveT(event,'${id||''}')"><label>宠物</label><select id="tp">${opts(S.pets,x.pid||S.ts)}</select><label>日期</label><input id="td" type="date" max="${today()}" value="${x.date||today()}"><label>内容</label><textarea id="tx" maxlength="500">${esc(x.text)}</textarea>${photoField('t')}<p class="err" id="err"></p>${btns}</form>`)}
function saveT(e,id){e.preventDefault();const o={pid:$('#tp').value,date:$('#td').value,text:$('#tx').value.trim(),photo:P.t};if(!o.date)return err('请选择日期');if(o.date>today())return err('日期不能晚于今天');if(!o.text&&!o.photo)return err('请写点内容或添加一张照片');
if(id)Object.assign(S.tl.find(x=>x.id==id),o);else{o.id=uid();S.tl.push(o)}save();close();render();toast(id?'已保存修改':'已添加到时间线')}
function delT(id){if(!confirm('确定删除这条日记？'))return;S.tl=S.tl.filter(x=>x.id!=id);save();render()}
/* 同城 */
function palView(id){const p=PALS.find(x=>x.id==id);modal(p.name+' 的资料',`${ph(p)}<p><b>${p.breed}</b>，${p.g}，${ageM(p.m)}</p><p class="mu">主人 ${p.owner}，${p.city}${p.area}</p><p>${p.bio}</p><div class="row"><button class="btn" onclick="fol('${p.id}');close()">${S.fol[id]?'取消收藏':'收藏'}</button><button class="btn g" onclick="close()">关闭</button></div>`)}
function fol(id){S.fol[id]=!S.fol[id];save();render();toast(S.fol[id]?'已收藏':'已取消收藏')}
/* 社区 */
function savePost(){const t=$('#pt').value.trim(),highlight=$('#highlight').value.trim();if(!t&&!highlight&&!P.f)return err('请写点内容、今日亮点或上传照片');const p=pet($('#pp').value);S.posts.push({id:uid(),text:t,highlight,photo:P.f,pn:p?.name||'',mood:S.mood,energy:S.energy,visibility:$('#visibility').value,t:Date.now()});P.f='';save();render();toast('日常记录已保存')}
function like(id){S.likes[id]=!S.likes[id];save();render()}
function addC(id){const i=$('#c_'+id),t=i.value.trim();if(!t)return toast('评论不能为空');(S.cmts[id]=S.cmts[id]||[]).push({t});save();render()}
function delP(id){if(!confirm('确定删除这条动态？'))return;S.posts=S.posts.filter(x=>x.id!=id);save();render()}
function resetAll(){if(!confirm('将清空你创建的所有宠物、记录和动态（演示数据不受影响）。确定吗？'))return;S=DEF();try{localStorage.removeItem(K)}catch(e){}render();toast('已清空')}
render();
</script>
</body>
</html>
